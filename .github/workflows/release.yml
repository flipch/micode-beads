name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.3.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.3.0)'
        required: true
        type: string

jobs:
  build-standalone:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone binaries
        run: sh scripts/build-standalone.sh

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/micode-beads-darwin-arm64 \
            dist/micode-beads-darwin-arm64.sha256 \
            dist/micode-beads-darwin-x64 \
            dist/micode-beads-darwin-x64.sha256 \
            dist/micode-beads-linux-arm64 \
            dist/micode-beads-linux-arm64.sha256 \
            dist/micode-beads-linux-x64 \
            dist/micode-beads-linux-x64.sha256

  publish:
    if: ${{ vars.NPM_PUBLISH_OIDC == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Check if already published
        id: check
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already published ${NAME}@${VERSION}"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (OIDC)
        if: steps.check.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          npm publish --provenance --access public
