name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Resolve package info
        id: pkg
        run: |
          echo "name=$(node -p \"require('./package.json').name\")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: published
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.published.outputs.published != 'true' && vars.NPM_PUBLISH_OIDC == 'true'
        run: npm publish --provenance --access public --ignore-scripts

      - name: Publish to npm (token)
        if: steps.published.outputs.published != 'true' && vars.NPM_PUBLISH_OIDC != 'true' && secrets.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --ignore-scripts

      - name: Publish skipped (no auth)
        if: steps.published.outputs.published != 'true' && vars.NPM_PUBLISH_OIDC != 'true' && secrets.NPM_TOKEN == ''
        run: echo "No publish auth configured. Set vars.NPM_PUBLISH_OIDC=true for OIDC or add NPM_TOKEN."
